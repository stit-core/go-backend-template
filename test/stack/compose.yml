name: ${COMPOSE_PROJECT_NAME:-e2e-local}

x-app-env: &app-env
  HTTP_ADDR: ":8080"
  HTTP_API_TITLE: backend-smoke
  HTTP_API_VERSION: 0.0.0-smoke

  PG_DSN: postgres://postgres:postgres@postgres:5432/app?sslmode=disable
  PG_REPLICA_DSN: postgres://postgres:postgres@postgres:5432/app?sslmode=disable
  PG_MIGRATIONS_PATH: /migrations

  # Зависимости китов графа (scripts/tools/kits.sh): их сервисы стека идут профилем с именем кита (lib.sh), у сервиса
  # без кита эти переменные никто не читает. Бакет сервиса (STORAGE_S3_BUCKET) — из .env.example, его заводит сам сервис.
  NATS_URL: nats://nats:4222
  REDIS_URL: redis://redis:6379/0
  STORAGE_S3_ENDPOINT: http://minio:9000
  STORAGE_S3_ACCESS_KEY: smoke-s3
  STORAGE_S3_SECRET_KEY: smoke-s3-secret
  STORAGE_S3_CREATE_BUCKET: "true"

  JWT_SECRET: smoke-only-secret-do-not-use-in-prod-min-32chars
  JWT_ACCESS_TTL: 15m

  # dev: лог-mailer (канала доставки писем у стека нет), cookie без Secure — клиент ходит по http, и
  # спецификация API (/openapi.*), которую сервис отдаёт только с HTTP_DOCS_ENABLED.
  APP_ENV: dev
  COOKIE_SECURE: "false"
  HTTP_DOCS_ENABLED: "true"
  # Адрес «страницы SPA» харнеса: клиент (test/client/http.py, E2E_ORIGIN) шлёт его в Origin, без него изменяющий
  # запрос с cookie сессии — 403 ORIGIN_NOT_ALLOWED.
  HTTP_CORS_ORIGINS: http://e2e.localhost
  OTEL_SDK_DISABLED: "true"

  LOG_LEVEL: debug

  OUTBOX_BATCH_SIZE: "100"
  OUTBOX_INTERVAL: 1s

  BRUTEFORCE_MAX_FAILURES: "5"
  BRUTEFORCE_LOCK_DURATION: 15m
  # Сценарии шлют вход и регистрацию подряд с одного адреса: строгий лимит /api/auth/* выключен, как в
  # integration-тестах (его держит TestBoot_AuthRateLimit), и 429 входа — только блокировка антибрутфорса.
  HTTP_AUTH_RATE_LIMIT_RPS: "0"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1::5432"
    networks: [smoke]

  # NATS с JetStream — у сервиса с событиями (natskit в графе): профиль включает lib.sh.
  nats:
    image: nats:2.10-alpine
    profiles: [natskit]
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1::8222"
      - "127.0.0.1::4222"
    networks: [smoke]

  # Redis — у сервиса с cachekit в графе: профиль включает lib.sh. Образ — как у testkit golibinfra (RedisImage).
  redis:
    image: redis:7-alpine
    profiles: [cachekit]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [smoke]

  # MinIO (S3) — у сервиса с storagekit в графе: профиль включает lib.sh. Образ — PGSTY Silo, как у testkit golibinfra
  # и профиля storage инфры проекта.
  minio:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    profiles: [storagekit]
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: smoke-s3
      MINIO_ROOT_PASSWORD: smoke-s3-secret
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [smoke]

  migrate:
    image: ${COMPOSE_PROJECT_NAME:-backend-smoke}:local
    build:
      context: ../..
      dockerfile: test/stack/Dockerfile.local
    env_file: ../../.env.example
    environment:
      <<: *app-env
    entrypoint: ["migrate"]
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [smoke]

  # Admin для e2e — у проекта со своей идентичностью (cmd/seed-admin): профиль включает lib.sh.
  seed-admin:
    image: ${COMPOSE_PROJECT_NAME:-backend-smoke}:local
    profiles: [seed-admin]
    env_file: ../../.env.example
    environment:
      <<: *app-env
      SEED_ADMIN_EMAIL: ${E2E_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: E2E Admin
    entrypoint: ["seed-admin"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [smoke]

  api:
    image: ${COMPOSE_PROJECT_NAME:-backend-smoke}:local
    env_file: ../../.env.example
    environment:
      <<: *app-env
    entrypoint: ["api"]
    # Как у деплоя: shell и wget в образе нет — бинарь сам спрашивает свой /health; up.sh ждёт healthy.
    healthcheck:
      test: ["CMD", "api", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
        required: false
      migrate:
        condition: service_completed_successfully
      seed-admin:
        condition: service_completed_successfully
        required: false
      redis:
        condition: service_healthy
        required: false
      minio:
        condition: service_healthy
        required: false
    ports:
      - "127.0.0.1::8080"
    networks: [smoke]

volumes:
  pgdata:
  natsdata:

networks:
  smoke:
    driver: bridge
