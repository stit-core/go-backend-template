name: ${COMPOSE_PROJECT_NAME:-e2e-local}

x-app-env: &app-env
  HTTP_ADDR: ":8080"
  HTTP_API_TITLE: backend-smoke
  HTTP_API_VERSION: 0.0.0-smoke

  PG_DSN: postgres://postgres:postgres@postgres:5432/app?sslmode=disable
  PG_REPLICA_DSN: postgres://postgres:postgres@postgres:5432/app?sslmode=disable
  PG_MIGRATIONS_PATH: /migrations

  NATS_URL: nats://nats:4222
  NATS_JETSTREAM_ENABLED: "true"
  NATS_JS_STREAM_NAMES: "user,verification"

  REDIS_URL: redis://redis:6379/0

  JWT_SECRET: smoke-only-secret-do-not-use-in-prod-min-32chars
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 720h

  APP_ENV: smoke

  LOG_LEVEL: debug

  OUTBOX_BATCH_SIZE: "100"
  OUTBOX_INTERVAL: 1s

  BRUTEFORCE_MAX_FAILURES: "5"
  BRUTEFORCE_LOCK_DURATION: 15m

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1::5432"
    networks: [smoke]

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1::8222"
      - "127.0.0.1::4222"
    networks: [smoke]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1::6379"
    networks: [smoke]

  migrate:
    image: ${COMPOSE_PROJECT_NAME:-backend-smoke}:local
    build:
      context: ../..
      dockerfile: test/stack/Dockerfile.local
    environment:
      <<: *app-env
    entrypoint: ["migrate"]
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [smoke]

  seed-admin:
    image: ${COMPOSE_PROJECT_NAME:-backend-smoke}:local
    environment:
      <<: *app-env
      SEED_ADMIN_EMAIL: ${E2E_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: E2E Admin
    entrypoint: ["seed-admin"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [smoke]

  api:
    image: ${COMPOSE_PROJECT_NAME:-backend-smoke}:local
    environment:
      <<: *app-env
    entrypoint: ["api"]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed-admin:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1::8080"
    networks: [smoke]

volumes:
  pgdata:
  natsdata:

networks:
  smoke:
    driver: bridge
