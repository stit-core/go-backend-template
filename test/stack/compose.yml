name: ${COMPOSE_PROJECT_NAME:-e2e-local}

x-app-env: &app-env
  HTTP_ADDR: ":8080"
  HTTP_API_TITLE: backend-smoke
  HTTP_API_VERSION: 0.0.0-smoke

  PG_DSN: postgres://postgres:postgres@postgres:5432/app?sslmode=disable
  PG_REPLICA_DSN: postgres://postgres:postgres@postgres:5432/app?sslmode=disable
  PG_MIGRATIONS_PATH: /migrations

  NATS_URL: nats://nats:4222

  JWT_SECRET: smoke-only-secret-do-not-use-in-prod-min-32chars
  JWT_ACCESS_TTL: 15m

  # dev: лог-mailer (канала доставки писем у стека нет), cookie без Secure — клиент ходит по http, и
  # спецификация API (/openapi.*), которую сервис отдаёт только с HTTP_DOCS_ENABLED.
  APP_ENV: dev
  COOKIE_SECURE: "false"
  HTTP_DOCS_ENABLED: "true"
  OTEL_SDK_DISABLED: "true"

  LOG_LEVEL: debug

  OUTBOX_BATCH_SIZE: "100"
  OUTBOX_INTERVAL: 1s

  BRUTEFORCE_MAX_FAILURES: "5"
  BRUTEFORCE_LOCK_DURATION: 15m
  # Сценарии шлют вход и регистрацию подряд с одного адреса: строгий лимит /api/auth/* выключен, как в
  # integration-тестах (его держит TestBoot_AuthRateLimit), и 429 входа — только блокировка антибрутфорса.
  HTTP_AUTH_RATE_LIMIT_RPS: "0"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1::5432"
    networks: [smoke]

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1::8222"
      - "127.0.0.1::4222"
    networks: [smoke]

  migrate:
    image: ${COMPOSE_PROJECT_NAME:-backend-smoke}:local
    build:
      context: ../..
      dockerfile: test/stack/Dockerfile.local
    env_file: ../../.env.example
    environment:
      <<: *app-env
    entrypoint: ["migrate"]
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [smoke]

  # Admin для e2e — у проекта со своей идентичностью (cmd/seed-admin): профиль включает lib.sh.
  seed-admin:
    image: ${COMPOSE_PROJECT_NAME:-backend-smoke}:local
    profiles: [seed-admin]
    env_file: ../../.env.example
    environment:
      <<: *app-env
      SEED_ADMIN_EMAIL: ${E2E_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: E2E Admin
    entrypoint: ["seed-admin"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [smoke]

  api:
    image: ${COMPOSE_PROJECT_NAME:-backend-smoke}:local
    env_file: ../../.env.example
    environment:
      <<: *app-env
    entrypoint: ["api"]
    # Как у деплоя: shell и wget в образе нет — бинарь сам спрашивает свой /health; up.sh ждёт healthy.
    healthcheck:
      test: ["CMD", "api", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed-admin:
        condition: service_completed_successfully
        required: false
    ports:
      - "127.0.0.1::8080"
    networks: [smoke]

volumes:
  pgdata:
  natsdata:

networks:
  smoke:
    driver: bridge
