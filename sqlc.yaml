version: "2"
sql:
  - engine: postgresql
    schema: migrations/
    queries: internal/domain/user/infra/postgres/queries/
    gen:
      go:
        package: db
        out: internal/domain/user/infra/postgres/db
        sql_package: pgx/v5
        emit_interface: false
        emit_exact_table_names: false
        emit_pointers_for_null_types: true
        emit_json_tags: false
        emit_prepared_queries: false
        emit_methods_with_db_argument: false
        omit_unused_structs: true
  - engine: postgresql
    schema: migrations/
    queries: internal/domain/verification/infra/postgres/queries/
    gen:
      go:
        package: db
        out: internal/domain/verification/infra/postgres/db
        sql_package: pgx/v5
        emit_interface: false
        emit_exact_table_names: false
        emit_pointers_for_null_types: true
        emit_json_tags: false
        emit_prepared_queries: false
        emit_methods_with_db_argument: false
        omit_unused_structs: true
