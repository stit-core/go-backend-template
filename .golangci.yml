version: "2"

run:
  timeout: 3m
  go: "1.26"

linters:
  default: none
  enable:
    # базовый набор
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - sqlclosecheck
    - staticcheck    # включает gosimple + stylecheck (v2 их слил)
    - unconvert
    - unused
    # tier-1 P1 дополнения
    - bodyclose
    - contextcheck
    - nilerr
    - noctx
    - rowserrcheck
    - errchkjson
    - wastedassign
    - forbidigo
    - depguard
    - tagalign

  settings:
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    revive:
      rules:
        - name: var-naming
        - name: unused-parameter
          disabled: true
        - name: exported
          disabled: true
    forbidigo:
      forbid:
        - pattern: '^fmt\.Print(ln|f)?$'
          msg: "use logkit.Logger instead of fmt.Print*"
        - pattern: '^slog\.'
          msg: "use logkit.Logger; do not call slog directly"
      analyze-types: true
    depguard:
      rules:
        user-domain-isolation:
          list-mode: lax
          files:
            - "**/internal/domain/user/**"
            - "!**/*_test.go"
            - "!**/internal/domain/user/module/**"
          deny:
            - pkg: "git.stit.tech/stit/go-backend-template/internal/domain/auth"
              desc: "user domain must not import auth"
            - pkg: "git.stit.tech/stit/go-backend-template/internal/domain/verification"
              desc: "user domain must not import verification"
        auth-domain-isolation:
          list-mode: lax
          files:
            - "**/internal/domain/auth/**"
            - "!**/*_test.go"
            - "!**/internal/domain/auth/module/**"
          deny:
            - pkg: "git.stit.tech/stit/go-backend-template/internal/domain/user"
              desc: "auth domain must not import user; use auth.UserReader port + adapter"
            - pkg: "git.stit.tech/stit/go-backend-template/internal/domain/verification"
              desc: "auth domain must not import verification"
        verification-domain-isolation:
          list-mode: lax
          files:
            - "**/internal/domain/verification/**"
            - "!**/*_test.go"
            - "!**/internal/domain/verification/module/**"
          deny:
            - pkg: "git.stit.tech/stit/go-backend-template/internal/domain/user"
              desc: "verification domain must not import user; use verification.UserReader port + adapter"
            - pkg: "git.stit.tech/stit/go-backend-template/internal/domain/auth"
              desc: "verification domain must not import auth"
        mocks-isolation:
          list-mode: lax
          files:
            - "**"
            - "!**/*_test.go"
          deny:
            - pkg: "git.stit.tech/stit/go-backend-template/internal/domain/auth/mocks"
              desc: "mocks are test-only; import only from *_test.go"
            - pkg: "git.stit.tech/stit/go-backend-template/internal/domain/auth/delivery/http/mocks"
              desc: "mocks are test-only; import only from *_test.go"
            - pkg: "git.stit.tech/stit/go-backend-template/internal/domain/user/mocks"
              desc: "mocks are test-only; import only from *_test.go"
            - pkg: "git.stit.tech/stit/go-backend-template/internal/domain/user/delivery/http/mocks"
              desc: "mocks are test-only; import only from *_test.go"
            - pkg: "git.stit.tech/stit/go-backend-template/internal/domain/verification/mocks"
              desc: "mocks are test-only; import only from *_test.go"
            - pkg: "git.stit.tech/stit/go-backend-template/internal/domain/verification/delivery/http/mocks"
              desc: "mocks are test-only; import only from *_test.go"
    tagalign:
      align: true
      sort: true
      order:
        - json
        - yaml
        - toml
        - mapstructure
        - validate

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - forbidigo
          - depguard
      # Optimistic-lock version — pgkit конвертит int↔int32; диапазон bounded by PG int4.
      - path: internal/domain/.+/infra/postgres/repository\.go
        linters:
          - gosec
        text: "G115"

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra-rules: true

severity:
  default: error
