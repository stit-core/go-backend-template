version: "2"

run:
  timeout: 3m
  go: "1.26"
  # integration-тесты — шаг make check: линтуются вместе с остальным кодом.
  build-tags:
    - integration
  # Параллельные прогоны (агенты в worktree, хуки) ждут общий lock, а не падают с exit 3.
  allow-serial-runners: true

linters:
  default: none
  enable:
    # базовый набор
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - sqlclosecheck
    - staticcheck    # включает gosimple + stylecheck (v2 их слил)
    - unconvert
    - unused
    # tier-1 P1 дополнения
    - bodyclose
    - contextcheck
    - nilerr
    - noctx
    - rowserrcheck
    - errchkjson
    - wastedassign
    - forbidigo
    - tagalign
    - nolintlint
    - testifylint
    - nonamedreturns # канон usecase: результаты без имён

  settings:
    errcheck:
      check-blank: true # `_ = f()` тоже глотает ошибку
    gosec:
      config:
        global:
          nosec: true # своя директива gosec ничего не глушит: ослабление — только //nolint:gosec с причиной
    nolintlint:
      require-explanation: true
      require-specific: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    revive:
      rules:
        - name: var-naming
        - name: unused-parameter
          disabled: true
        - name: exported
          disabled: true
    forbidigo:
      forbid:
        - pattern: '^fmt\.Print(ln|f)?$'
          msg: "use logkit.Logger instead of fmt.Print*"
        - pattern: '^slog\.'
          msg: "use logkit.Logger; do not call slog directly"
        - pattern: '^log\.'
          msg: "use logkit.Logger instead of the standard log package"
        - pattern: '^(print|println)$'
          msg: "use logkit.Logger instead of builtin print/println"
        - pattern: '^os\.(Stdout|Stderr)$'
          msg: "write logs via logkit.Logger, not os.Stdout/os.Stderr"
      analyze-types: true
    tagalign:
      align: true
      sort: true
      order:
        - json
        - yaml
        - toml
        - mapstructure
        - validate

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - forbidigo
      # int → int4 запроса: версия optimistic-lock — из int4 колонки, страница — в пределах paging.Page.
      - path: internal/domain/.+/infra/postgres/repository\.go
        linters:
          - gosec
        text: "G115"

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra-rules: true

severity:
  default: error
