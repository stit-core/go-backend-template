version: "2"

run:
  timeout: 3m
  go: "1.26"
  # integration-тесты — шаг make check: линтуются вместе с остальным кодом.
  build-tags:
    - integration
  # Параллельные прогоны (агенты в worktree, хуки) ждут общий lock, а не падают с exit 3.
  allow-serial-runners: true

linters:
  default: none
  enable:
    # базовый набор
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - sqlclosecheck
    - staticcheck    # включает gosimple + stylecheck (v2 их слил)
    - unconvert
    - unused
    # tier-1 P1 дополнения
    - bodyclose
    - contextcheck
    - nilerr
    - noctx
    - rowserrcheck
    - errchkjson
    - wastedassign
    - forbidigo
    - depguard
    - tagalign
    - nolintlint
    - testifylint

  settings:
    errcheck:
      check-blank: true # `_ = f()` тоже глотает ошибку
    nolintlint:
      require-explanation: true
      require-specific: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    revive:
      rules:
        - name: var-naming
        - name: unused-parameter
          disabled: true
        - name: exported
          disabled: true
    forbidigo:
      forbid:
        - pattern: '^fmt\.Print(ln|f)?$'
          msg: "use logkit.Logger instead of fmt.Print*"
        - pattern: '^slog\.'
          msg: "use logkit.Logger; do not call slog directly"
        - pattern: '^log\.'
          msg: "use logkit.Logger instead of the standard log package"
        - pattern: '^(print|println)$'
          msg: "use logkit.Logger instead of builtin print/println"
        - pattern: '^os\.(Stdout|Stderr)$'
          msg: "write logs via logkit.Logger, not os.Stdout/os.Stderr"
      analyze-types: true
    depguard:
      rules:
        # Strict cross-domain isolation: deny the whole internal/domain prefix,
        # allow only the domain's own subtree. list-mode lax + longest-prefix
        # override → own imports match the longer allow; any sibling (incl. ones
        # not yet created) matches the umbrella deny. module/ wires providers via
        # adapters, so it's exempt; test files are exempt (also globally below).
        user-domain-isolation:
          list-mode: lax
          files:
            - "**/internal/domain/user/**"
            - "!**/*_test.go"
            - "!**/internal/domain/user/module/**"
          allow:
            - "git.stit.tech/stit-core/go-backend-template/internal/domain/user"
          deny:
            - pkg: "git.stit.tech/stit-core/go-backend-template/internal/domain"
              desc: "cross-domain imports are forbidden; use a port + adapter in module/"
        auth-domain-isolation:
          list-mode: lax
          files:
            - "**/internal/domain/auth/**"
            - "!**/*_test.go"
            - "!**/internal/domain/auth/module/**"
          allow:
            - "git.stit.tech/stit-core/go-backend-template/internal/domain/auth"
          deny:
            - pkg: "git.stit.tech/stit-core/go-backend-template/internal/domain"
              desc: "cross-domain imports are forbidden; use a port + adapter in module/"
        verification-domain-isolation:
          list-mode: lax
          files:
            - "**/internal/domain/verification/**"
            - "!**/*_test.go"
            - "!**/internal/domain/verification/module/**"
          allow:
            - "git.stit.tech/stit-core/go-backend-template/internal/domain/verification"
          deny:
            - pkg: "git.stit.tech/stit-core/go-backend-template/internal/domain"
              desc: "cross-domain imports are forbidden; use a port + adapter in module/"
        mocks-isolation:
          list-mode: lax
          files:
            - "**"
            - "!**/*_test.go"
          deny:
            - pkg: "git.stit.tech/stit-core/go-backend-template/internal/domain/auth/mocks"
              desc: "mocks are test-only; import only from *_test.go"
            - pkg: "git.stit.tech/stit-core/go-backend-template/internal/domain/auth/delivery/http/mocks"
              desc: "mocks are test-only; import only from *_test.go"
            - pkg: "git.stit.tech/stit-core/go-backend-template/internal/domain/user/mocks"
              desc: "mocks are test-only; import only from *_test.go"
            - pkg: "git.stit.tech/stit-core/go-backend-template/internal/domain/user/delivery/http/mocks"
              desc: "mocks are test-only; import only from *_test.go"
            - pkg: "git.stit.tech/stit-core/go-backend-template/internal/domain/verification/mocks"
              desc: "mocks are test-only; import only from *_test.go"
            - pkg: "git.stit.tech/stit-core/go-backend-template/internal/domain/verification/delivery/http/mocks"
              desc: "mocks are test-only; import only from *_test.go"
    tagalign:
      align: true
      sort: true
      order:
        - json
        - yaml
        - toml
        - mapstructure
        - validate

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - forbidigo
          - depguard
      # Optimistic-lock version — pgkit конвертит int↔int32; диапазон bounded by PG int4.
      - path: internal/domain/.+/infra/postgres/repository\.go
        linters:
          - gosec
        text: "G115"

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra-rules: true

severity:
  default: error
